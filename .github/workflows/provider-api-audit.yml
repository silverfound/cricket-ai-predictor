name: Manual cricket provider API audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cricket-provider-api-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP client
        run: python -m pip install requests
      - name: Probe configured providers (read-only; no production snapshot changes)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          SECONDARY_API_KEY: ${{ secrets.SECONDARY_API_KEY }}
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
        run: python scripts/audit_provider_apis.py
