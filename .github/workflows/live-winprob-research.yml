name: Live win-probability research (free data)
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/train_live_winprob_candidate.py"
      - "scripts/export_live_winprob_browser.py"
      - "live_model_runtime.js"
      - "tests/test_live_model_runtime.js"
      - ".github/workflows/live-winprob-research.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-winprob-research
  cancel-in-progress: false
jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research-only dependencies
        run: python -m pip install duckdb lightgbm pandas numpy scikit-learn joblib requests
      - name: Build delivery states and evaluate chronological candidate
        run: python scripts/train_live_winprob_candidate.py
      - name: Export browser-compatible calibrated model
        run: python scripts/export_live_winprob_browser.py
      - name: Verify browser inference against Python holdout vectors
        run: node tests/test_live_model_runtime.js
      - name: Upload research-only model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: live-winprob-research-2024-2026
          path: live_model_research/
          if-no-files-found: error
          retention-days: 30
