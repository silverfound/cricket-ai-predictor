name: Refresh cricket data and deploy Pages
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, migration/github-actions-only]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: cricket-pages-refresh
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install prediction runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate source syntax, tests, and immutable model artifacts
        run: |
          python -m py_compile scripts/update_matches.py scripts/provider_fallbacks.py scripts/prediction_formats.py scripts/audit_prediction_models.py scripts/highlightly_live_model.py scripts/enrich_live_matches.py
          python -m unittest discover -s tests -v
          python scripts/audit_t10_data.py
          python scripts/audit_prediction_models.py
          python scripts/chronological_elo_backtest.py
          node --check script.js
          node --check live_model_ui.js
          test "$(git hash-object cricket_ensemble_modern.joblib)" = "e6d7ba073174ddbafaa504c090702483063649a2"
          test "$(git hash-object latest_elo_ratings.joblib)" = "ba9b707b9bb4915e812fd3b310616059154b0bf5"
          test "$(git hash-object category_mappings.joblib)" = "682ae8a0568d4c2a88282ca78f5785ca0f761b7e"
          test "$(git hash-object toss_stats.joblib)" = "e9952cb3c51a2c7b0843bd67bbacceac112a6fbc"
  refresh-and-deploy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install model runtime
        run: python -m pip install -r requirements.txt
      - name: Retrieve latest validated T20/ODI live-model bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow live-winprob-research.yml --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$run_id"
          mkdir -p /tmp/live-model data
          gh run download "$run_id" --name live-winprob-research-2024-2026 --dir /tmp/live-model
          test -s /tmp/live-model/live_winprob_browser.json
          cp /tmp/live-model/live_winprob_browser.json data/live_winprob_browser.json
          python -c "import json; p=json.load(open('data/live_winprob_browser.json')); assert {'T20','ODI'} <= set(p['supported_formats']); print('LIVE_MODEL_BUNDLE=READY formats='+','.join(p['supported_formats']))"
      - name: Fetch all allowed provider pages and compute prediction snapshots
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
          SECONDARY_API_KEY: ${{ secrets.SECONDARY_API_KEY }}
        run: python scripts/update_matches.py
      - name: Generate Highlightly live win-probability snapshots
        env:
          SECONDARY_API_KEY: ${{ secrets.SECONDARY_API_KEY }}
        run: python scripts/enrich_live_matches.py
      - name: Check generated snapshot, frontend, and immutable model files
        run: |
          test -s data/matches.json
          node --check script.js
          node --check live_model_ui.js
          test -s data/matches.json
          test "$(git hash-object cricket_ensemble_modern.joblib)" = "e6d7ba073174ddbafaa504c090702483063649a2"
          test "$(git hash-object latest_elo_ratings.joblib)" = "ba9b707b9bb4915e812fd3b310616059154b0bf5"
          test "$(git hash-object category_mappings.joblib)" = "682ae8a0568d4c2a88282ca78f5785ca0f761b7e"
          test "$(git hash-object toss_stats.joblib)" = "e9952cb3c51a2c7b0843bd67bbacceac112a6fbc"
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html script.js live_model_ui.js manifest.json _site/
          cp data/matches.json _site/data/matches.json
          cp data/grounds.json _site/data/grounds.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
