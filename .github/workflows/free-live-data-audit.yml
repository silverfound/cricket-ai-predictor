name: Free live-data source audit
on:
  pull_request:
    paths:
      - "scripts/audit_sportscore_live.py"
      - "scripts/audit_free_ball_data.py"
      - ".github/workflows/free-live-data-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-live-data-source-audit
  cancel-in-progress: false
jobs:
  sportscore-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP client
        run: python -m pip install requests
      - name: Probe configured live-score providers and free endpoints
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
        run: python scripts/audit_sportscore_live.py
      - name: Audit free Cricsheet ball-by-ball history
        run: python scripts/audit_free_ball_data.py
      - name: Mark final provider probe revision
        run: echo FINAL_PROVIDER_PROBE_V6=1
