name: Build and smoke-test backend container

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cricket_test
          POSTGRES_PASSWORD: cricket_test
          POSTGRES_DB: cricket_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cricket_test -d cricket_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image (no push)
        run: docker build --tag cricket-ai-predictor:ci .
      - name: Start API container
        run: |
          docker run --detach --name cricket-api --network host \
            -e PORT=8000 \
            -e DATABASE_URL=postgresql://cricket_test:cricket_test@127.0.0.1:5432/cricket_runtime_test \
            -e CORS_ALLOWED_ORIGINS=https://silverfound.github.io \
            cricket-ai-predictor:ci
      - name: Verify liveness and readiness
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/live >/dev/null; then
              ready=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' cricket-api 2>/dev/null | grep -qx true; then
              echo "API container exited before becoming healthy."
              docker logs cricket-api || true
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "API did not become healthy within 120 seconds."
            docker inspect cricket-api || true
            docker logs cricket-api || true
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8000/health/live
          curl --fail --silent http://127.0.0.1:8000/health/ready
          curl --fail --silent --include --request OPTIONS \
            --header "Origin: https://silverfound.github.io" \
            --header "Access-Control-Request-Method: PUT" \
            --header "Access-Control-Request-Headers: content-type,x-admin-key" \
            http://127.0.0.1:8000/admin/licenses/1/matches | tee /tmp/cors-preflight.txt
          grep -qi "access-control-allow-origin: https://silverfound.github.io" /tmp/cors-preflight.txt
          grep -qi "access-control-allow-methods:.*PUT" /tmp/cors-preflight.txt
          grep -qi "access-control-allow-headers:.*x-admin-key" /tmp/cors-preflight.txt
      - name: Stop API container
        if: always()
        run: docker rm --force cricket-api || true
