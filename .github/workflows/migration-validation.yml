name: Validate migration branch

on:
  pull_request:
    branches: [main]
  push:
    branches: [migration/github-pages-frontend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q main.py licensing.py
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check admin.js
          node --check api-config.js
      - name: Verify required static frontend files
        run: |
          test -s index.html
          test -s script.js
          test -s api-config.js
          test -s admin.html
          test -s admin.js
          test -s manifest.json
      - name: Verify trained model Git blobs are unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:cricket_ensemble_modern.joblib)" = "e6d7ba073174ddbafaa504c090702483063649a2"
          test "$(git rev-parse HEAD:latest_elo_ratings.joblib)" = "ba9b707b9bb4915e812fd3b310616059154b0bf5"
          test "$(git rev-parse HEAD:category_mappings.joblib)" = "682ae8a0568d4c2a88282ca78f5785ca0f761b7e"
          test "$(git rev-parse HEAD:toss_stats.joblib)" = "e9952cb3c51a2c7b0843bd67bbacceac112a6fbc"
          echo "All four trained model artifacts match the approved immutable Git blobs."
