name: Licensing API tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  licensing-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cricket_test
          POSTGRES_PASSWORD: cricket_test
          POSTGRES_DB: cricket_licensing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cricket_test -d cricket_licensing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cricket_test:cricket_test@localhost:5432/cricket_licensing_test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest fastapi "psycopg[binary]"
      - name: Run licensing integration tests
        run: python -m pytest -q
