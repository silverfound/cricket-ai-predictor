<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket AI Pro</title>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-glow: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--card-bg);
            padding: 16px;
            text-align: center;
            border-bottom: 2px solid var(--accent-glow);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-glow);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        main {
            flex: 1;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--accent-glow);
        }
        p {
            color: var(--text-muted);
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            width: 100%;
            background-color: var(--accent-glow);
            color: #0b0f19;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cricket AI Pro</h1>
    </header>

    <main>
        <div class="card">
            <h2>Live Match Predictor</h2>
            <p>AI-powered real-time cricket analytics and predictive modeling dashboard for upcoming fixtures and live stats.</p>
            <a href="#" class="btn">Check Live Analytics</a>
        </div>

        <div class="card">
            <h2>Model Status</h2>
            <p>Elo Team-Aware Pipeline status: <strong>Active & Synced</strong></p>
            <p>API Connection: Connected via OpenCricket & Sport Score.</p>
        </div>

        <!-- Yeh raha dynamic container jahan API ka data show hoga -->
        <div id="dynamic-prediction-area"></div>
    </main>

    <!-- JavaScript File Linkage -->
    <script src="script.js?v=9"></script>
</body>
</html>
